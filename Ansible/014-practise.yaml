---
- name: complete webapp deployment
  hosts: all
  become: true
  vars:
    packages:
      - git
      - curl
      - unzip
      - zip 
      - htop
    app_user: shripad
    app_directory: /home/devops

  tasks:
    - name: Display hostname
      debug:
        msg: "Configuration server {{ inventory_hostname }}"
    - name: Display the OS
      debug:
        msg: "OS is {{ ansible_distribution }}"
   # install packages via loops
    
    - name: install required packages
      apt:
        name: "{{ item }}"
        state: present
      loop: "{{ packages }}"

    # create application user
    - name: create application user
      user:
        name: "{{ app_user }}"
        shell: /bin/bash
        state: present

    # create multiple directory using loops
    - name: Create application directory
      file:
        path: "{{ app_directory }}/{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
      loop:
        - mydirectory
        - configdir
        - inventorydir
    #copy file

    - name: copy application configuration
      copy:
        src: /home/devops/application.conf
        dest: "{{ app_directory }}/application.conf"

    - name: Install nginx
      apt:
        name: nginx
        state: present
      when: ansible_os_family == "Debian"        
      notify:
             - Restart nginx
  
  handlers:
    - name: Restart nginx
      service:
        name: nginx
        state: restarted
